name: CI/CD PRESTA-APP (REACT NATIVE/EXPO)
on:
  push:
    branches: [ "main" ]

permissions:
  contents: read
  packages: write # Vital para subir la imagen a GitHub

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependencias
        run: npm install

      # Evaluamos el código usando la tecnología real de tu proyecto
      - name: Verificar código con ESLint
        run: npx eslint .

      # Compilamos la versión Web de tu app (genera la carpeta 'dist')
      - name: Construir versión Web (Expo)
        run: npx expo export --platform web

      - name: Iniciar sesión en GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir y subir imagen Docker
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # Etiqueta estrictamente en minúsculas
          tags: ghcr.io/emmamadrid/presta-app-main:latest